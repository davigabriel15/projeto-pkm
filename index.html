<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Leilão Pokémon</title>
    <link rel="stylesheet" href="menu.style.css">
</head>
<body>

    <div class="menu-container">
        <div class="logo">
            <img src="imagens/pixil-frame-0.png" alt="Logo poke_draft">
        </div>
        
        <form id="form-inicio" onsubmit="salvarEIniciar(event)" autocomplete="off">
            
            <div class="campo">
                <label for="seu-nome">Seu Nome:</label>
                <input type="text" id="seu-nome" placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="codigo-sala">Código da Sala (para entrar):</label>
                <input type="text" id="codigo-sala" placeholder="Deixe em branco para criar nova" style="text-transform: uppercase;">
            </div>

            <div class="campo">
                <label for="modo-jogo">Modo de Jogo:</label>
                <select id="modo-jogo">
                    <option value="padrao">Padrão (R$ 100)</option>
                    <option value="pobre">Modo Pobre (R$ 20)</option>
                    <option value="rapido">Modo Rápido (3 Pokémon - R$ 100)</option>
                </select>
            </div>

            <div class="campo">
                <label for="estagio-pkm">Estágio do Pokémon:</label>
                <select id="estagio-pkm">
                    <option value="normal">Estágio Sorteado (Normal)</option>
                    <option value="final">Evolução Final (Ex: Charmander → Charizard)</option>
                </select>
            </div>

            <button type="submit" class="btn-iniciar">Entrar / Criar Sala</button>
        </form>
    </div>

    <script>
        function salvarEIniciar(event) {
            event.preventDefault();

            const nome = document.getElementById('seu-nome').value || "Jogador";
            let sala = document.getElementById('codigo-sala').value.trim().toUpperCase();
            const modo = document.getElementById('modo-jogo').value;
            const estagio = document.getElementById('estagio-pkm').value;

            // Se não digitou código de sala, gera um código aleatório de 4 letras
            if (!sala) {
                sala = Math.random().toString(36).substring(2, 6).toUpperCase();
            }

            localStorage.setItem('pkm_meu_nome', nome);
            localStorage.setItem('pkm_sala_id', sala);
            localStorage.setItem('pkm_modo', modo);
            localStorage.setItem('pkm_estagio', estagio);

            window.location.href = 'jogo.html';
        }
    </script>
</body>
</html>
