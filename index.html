<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Leilão Pokémon</title>
    <link rel="stylesheet" href="menu.style.css">
</head>
<body>

    <div class="menu-container">
        <div class="logo">
            <img src="imagens/pixil-frame-0.png" alt="Logo poke_draft">
        </div>
        <form id="form-inicio" onsubmit="salvarEIniciar(event)">
            
            <div class="campo">
                <label for="jogador1">Nome Jogador 1:</label>
                <input type="text" id="jogador1" placeholder="Jogador 1" required>
            </div>

            <div class="campo">
                <label for="jogador2">Nome Jogador 2:</label>
                <input type="text" id="jogador2" placeholder="Jogador 2" required>
            </div>

            <div class="campo">
                <label for="modo-jogo">Modo de Jogo:</label>
                <select id="modo-jogo">
                    <option value="padrao">Padrão (R$ 100)</option>
                    <option value="pobre">Modo Pobre (R$ 20)</option>
                    <option value="rapido">Modo Rápido (3 Pokémon - R$ 100)</option>
                </select>
            </div>

            <div class="campo">
                <label for="estagio-pkm">Estágio do Pokémon:</label>
                <select id="estagio-pkm">
                    <option value="normal">Estágio Sorteado (Normal)</option>
                    <option value="final">Evolução Final (Ex: Charmander → Charizard)</option>
                </select>
            </div>

            <button type="submit" class="btn-iniciar">Iniciar Leilão</button>
        </form>
    </div>

    <script>
        function salvarEIniciar(event) {
            event.preventDefault();

            const j1 = document.getElementById('jogador1').value || "Jogador 1";
            const j2 = document.getElementById('jogador2').value || "Jogador 2";
            const modo = document.getElementById('modo-jogo').value;
            const estagio = document.getElementById('estagio-pkm').value;

            localStorage.setItem('pkm_jogador1', j1);
            localStorage.setItem('pkm_jogador2', j2);
            localStorage.setItem('pkm_modo', modo);
            localStorage.setItem('pkm_estagio', estagio);

            window.location.href = 'jogo.html';
        }
    </script>
</body>
</html>
